services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vulngraph-backend
    ports:
      - "8002:8002"
    env_file:
      - .env
    volumes:
      - ./demo_project:/app/demo_project:ro
      - ./sample_project:/app/sample_project:ro

      # Mount Windows drives (read-only)
      - /mnt/c:/host/c:ro
      - /mnt/d:/host/d:ro
      - /mnt/e:/host/e:ro
      - /mnt/f:/host/f:ro

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8002
    container_name: vulngraph-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend