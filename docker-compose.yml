services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vulngraph-backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./demo_project:/app/demo_project:ro
      - ./sample_project:/app/sample_project:ro

      # Mount Windows drives (read-only)
      - C:/:/host/c:ro
      - D:/:/host/d:ro
      - E:/:/host/e:ro
      - F:/:/host/f:ro

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8001
    container_name: vulngraph-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend