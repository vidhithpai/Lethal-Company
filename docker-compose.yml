services:

  # ── Python / FastAPI backend ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vulngraph-backend
    ports:
      - "8001:8001"          # browser calls http://localhost:8001
    env_file:
      - .env                 # loads GEMINI_API_KEY (never baked into the image)
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount demo_project so users can also scan local folders by path
      - ./demo_project:/app/demo_project:ro
      - ./sample_project:/app/sample_project:ro
      # Optional: mount an external project to scan — uncomment and change path
      # - /path/to/your/project:/app/target_project:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── React frontend (nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # The browser (running on the HOST machine) calls this URL.
        # localhost:8001 works because Docker exposes that port to the host.
        VITE_API_URL: http://localhost:8001
    container_name: vulngraph-frontend
    ports:
      - "5173:80"            # open http://localhost:5173 in your browser
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
